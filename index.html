<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>物品連線遊戲</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            /* 將背景顏色改為與你遊戲一致的米白色，避免出現黑色邊框的突兀感 */
            background-color: #fbf7ec; 
            display: flex; 
            justify-content: center; /* 水平置中 */
            align-items: center;     /* 垂直置中 */
            height: 100vh; 
            width: 100vw;
        }
        canvas { 
            display: block; 
            /* 讓畫布根據螢幕大小縮放，但保持 16:9 比例 */
            max-width: 100vw; 
            max-height: 100vh; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 1920,
            height: 1080,
            scale: { 
                mode: Phaser.Scale.FIT, 
                // 關閉 Phaser 自帶的置中，改由 CSS 的 Flexbox 全權處理
                autoCenter: Phaser.Scale.NO_CENTER 
            },
            scene: { preload, create, update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            this.load.image('bg', 'bg.png');
            for(let i = 1; i <= 6; i++) { this.load.image(i.toString(), i + '.png'); }
            this.load.image('win_end_1', 'win_end_1.png');
            this.load.image('win_end_2', 'win_end_2.png');
            this.load.audio('bgm', 'bgm.mp3');
        }

        // ... (以下 create, showWinMessage, update 函數內容保持不變)
        // 這些邏輯不需要更動，因為我們已經在 CSS 層面處理好顯示位置了
        function create() {
            this.add.image(960, 540, 'bg').setDisplaySize(1920, 1080);
            this.bgmStarted = false;
            this.allLines = [];
            this.currentPath = [];
            this.isDrawing = false;
            this.graphics = this.add.graphics();
            const cloudCenter = { x: 1300, y: 500 }; 
            const cloudRadius = 320; 
            const itemTypes = ['1', '2', '3', '4', '5', '6'];
            const levelData = [];
            itemTypes.forEach(type => {
                for (let i = 0; i < 2; i++) {
                    let x, y, tooClose;
                    do {
                        tooClose = false;
                        let angle = Math.random() * Math.PI * 2;
                        let dist = Math.random() * cloudRadius;
                        x = cloudCenter.x + Math.cos(angle) * dist;
                        y = cloudCenter.y + Math.sin(angle) * dist;
                        for (let existing of levelData) {
                            if (Phaser.Math.Distance.Between(x, y, existing.x, existing.y) < 160) { tooClose = true; break; }
                        }
                    } while (tooClose);
                    levelData.push({ x, y, type: type });
                }
            });
            this.items = levelData.map(data => {
                let item = this.add.sprite(data.x, data.y, data.type).setInteractive();
                item.setDisplaySize(100, 120);
                item.itemType = data.type;
                item.isLinked = false;
                item.blinkTween = this.tweens.add({ targets: item, alpha: 0.6, duration: 1200, yoyo: true, loop: -1 });
                item.on('pointerdown', (pointer) => {
                    if (!this.bgmStarted) {
                        this.sound.add('bgm', { loop: true, volume: 1.0 }).play();
                        this.bgmStarted = true;
                    }
                    let existingIdx = this.allLines.findIndex(l => l.startItem === item || l.endItem === item);
                    if (existingIdx !== -1) {
                        this.allLines[existingIdx].startItem.isLinked = false;
                        this.allLines[existingIdx].endItem.isLinked = false;
                        this.allLines.splice(existingIdx, 1);
                    } else {
                        this.isDrawing = true;
                        this.activeType = item.itemType;
                        this.startItem = item;
                        this.startX = item.x; this.startY = item.y;
                        this.currentPath = [];
                    }
                });
                return item;
            });
            this.input.on('pointermove', (pointer) => {
                if (!this.isDrawing) return;
                this.currentPath.push({x: pointer.x, y: pointer.y});
            });
            this.input.on('pointerup', (pointer) => {
                if (!this.isDrawing) return;
                let found = this.items.find(s => s.itemType === this.activeType && s !== this.startItem && !s.isLinked && Phaser.Math.Distance.Between(pointer.x, pointer.y, s.x, s.y) < 100);
                if (found) {
                    this.allLines.push({ points: [...this.currentPath], startX: this.startX, startY: this.startY, endX: found.x, endY: found.y, startItem: this.startItem, endItem: found });
                    this.startItem.isLinked = true; found.isLinked = true;
                    if (this.items.every(item => item.isLinked === true)) { showWinMessage.call(this); }
                }
                this.isDrawing = false; this.currentPath = [];
            });
        }
        function showWinMessage() {
            let overlay = this.add.rectangle(960, 540, 1920, 1080, 0xfbf7ec).setDepth(200).setAlpha(0);
            let img1 = this.add.image(960, 540, 'win_end_1').setAlpha(0).setDepth(201);
            let img2 = this.add.image(960, 540, 'win_end_2').setAlpha(0).setDepth(201);
            this.tweens.add({ targets: [overlay, img1], alpha: 1, duration: 1500, onComplete: () => {
                this.time.delayedCall(1000, () => {
                    this.tweens.add({ targets: img1, alpha: 0, duration: 1500 });
                    this.tweens.add({ targets: img2, alpha: 1, duration: 1500 });
                });
            }});
        }
        function update() {
            this.graphics.clear();
            this.allLines.forEach(line => {
                this.graphics.lineStyle(12, 0x9fa8a3, 0.8);
                this.graphics.beginPath();
                this.graphics.moveTo(line.startX, line.startY);
                line.points.forEach(p => this.graphics.lineTo(p.x, p.y));
                this.graphics.lineTo(line.endX, line.endY);
                this.graphics.strokePath();
            });
            if (this.isDrawing) {
                this.graphics.lineStyle(12, 0x9fa8a3, 0.8);
                this.graphics.beginPath();
                this.graphics.moveTo(this.startX, this.startY);
                this.currentPath.forEach(p => this.graphics.lineTo(p.x, p.y));
                this.graphics.strokePath();
            }
        }
    </script>
</body>
</html>
